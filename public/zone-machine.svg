<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" fill="none" stroke="#F4F4F2" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <rect width="320" height="200" fill="#0A0A0B" stroke="none"/>
  <!-- 地面 -->
  <line x1="16" y1="172" x2="304" y2="172"/>
  <!-- 配重塔导轨 -->
  <line x1="228" y1="78" x2="228" y2="168"/>
  <line x1="272" y1="78" x2="272" y2="168"/>
  <!-- 配重片一叠（最顶一片薄荷绿 = 插销位置） -->
  <rect x="230" y="152" width="40" height="11" rx="1.5"/>
  <rect x="230" y="139" width="40" height="11" rx="1.5"/>
  <rect x="230" y="126" width="40" height="11" rx="1.5"/>
  <rect x="230" y="113" width="40" height="11" rx="1.5"/>
  <rect x="230" y="100" width="40" height="11" rx="1.5"/>
  <rect x="230" y="87" width="40" height="11" rx="1.5" stroke="#3FE1B1"/>
  <!-- 座椅 -->
  <rect x="88" y="120" width="62" height="12" rx="3"/>
  <line x1="116" y1="132" x2="116" y2="168"/>
  <line x1="102" y1="168" x2="130" y2="168"/>
  <!-- 靠背 -->
  <rect x="84" y="68" width="12" height="52" rx="3"/>
  <!-- 钢索：配重塔顶 → 高滑轮 → 把手 -->
  <line x1="250" y1="87" x2="250" y2="60"/>
  <circle cx="250" cy="54" r="6"/>
  <line x1="250" y1="54" x2="150" y2="46"/>
  <circle cx="150" cy="46" r="6"/>
  <line x1="150" y1="52" x2="122" y2="88"/>
  <!-- 拉杆把手 -->
  <line x1="104" y1="88" x2="140" y2="88"/>
  <line x1="104" y1="88" x2="104" y2="95"/>
  <line x1="140" y1="88" x2="140" y2="95"/>
</svg>
