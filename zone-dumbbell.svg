<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" fill="none" stroke="#F4F4F2" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <rect width="320" height="200" fill="#0A0A0B" stroke="none"/>
  <!-- 双层架：两层横杆 + A 字腿 -->
  <line x1="50" y1="92" x2="272" y2="92"/>
  <line x1="50" y1="148" x2="272" y2="148"/>
  <line x1="58" y1="92" x2="58" y2="172"/>
  <line x1="264" y1="92" x2="264" y2="172"/>
  <line x1="46" y1="172" x2="72" y2="172"/>
  <line x1="250" y1="172" x2="278" y2="172"/>
  <!-- 上层：小哑铃一对（斜放） -->
  <g transform="rotate(-8 96 82)">
    <rect x="78" y="72" width="7" height="20" rx="2"/>
    <rect x="107" y="72" width="7" height="20" rx="2"/>
    <line x1="85" y1="82" x2="107" y2="82"/>
  </g>
  <g transform="rotate(-8 152 80)">
    <rect x="132" y="69" width="9" height="24" rx="2"/>
    <rect x="165" y="69" width="9" height="24" rx="2"/>
    <line x1="141" y1="81" x2="165" y2="81"/>
  </g>
  <!-- 下层：更大的哑铃，最重一只薄荷绿 -->
  <g transform="rotate(-8 102 132)">
    <rect x="80" y="119" width="11" height="28" rx="2.5"/>
    <rect x="117" y="119" width="11" height="28" rx="2.5"/>
    <line x1="91" y1="133" x2="117" y2="133"/>
  </g>
  <g transform="rotate(-8 176 130)" stroke="#3FE1B1">
    <rect x="148" y="114" width="13" height="34" rx="2.5"/>
    <rect x="193" y="114" width="13" height="34" rx="2.5"/>
    <line x1="161" y1="131" x2="193" y2="131"/>
  </g>
</svg>
