<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" fill="none" stroke="#F4F4F2" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <rect width="320" height="200" fill="#0A0A0B" stroke="none"/>
  <!-- 深蹲架两立柱 -->
  <line x1="84" y1="28" x2="84" y2="166"/>
  <line x1="236" y1="28" x2="236" y2="166"/>
  <!-- 立柱脚 -->
  <line x1="62" y1="166" x2="106" y2="166"/>
  <line x1="214" y1="166" x2="258" y2="166"/>
  <!-- 立柱孔位 -->
  <line x1="80" y1="44" x2="88" y2="44"/>
  <line x1="80" y1="56" x2="88" y2="56"/>
  <line x1="232" y1="44" x2="240" y2="44"/>
  <line x1="232" y1="56" x2="240" y2="56"/>
  <!-- J 钩 -->
  <path d="M84 66 h-9 v8"/>
  <path d="M236 66 h9 v8"/>
  <!-- 奥林匹克杠铃杆 -->
  <line x1="28" y1="66" x2="292" y2="66"/>
  <!-- 杠铃片（两侧各一片） -->
  <rect x="34" y="48" width="15" height="36" rx="3"/>
  <rect x="271" y="48" width="15" height="36" rx="3"/>
  <!-- 卡箍 -->
  <line x1="58" y1="60" x2="58" y2="72"/>
  <line x1="262" y1="60" x2="262" y2="72"/>
  <!-- 安全臂（薄荷绿虚线） -->
  <line x1="84" y1="112" x2="138" y2="112" stroke="#3FE1B1" stroke-dasharray="6 5"/>
  <line x1="182" y1="112" x2="236" y2="112" stroke="#3FE1B1" stroke-dasharray="6 5"/>
</svg>
